; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
description = OSSM M5 Remote Redux
data_dir = data
default_envs = m5stack-cores3

[project_metadata]
display_name = OSSM M5 Remote Redux
artifact_name = OSSM-M5-Remote-Redux
version = 0.5.3
default_charge_current_ma = 500

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
custom_firmware_package_source = $BUILD_DIR/${PROGNAME}.factory.bin
extra_scripts = 
    pre:scripts/build_config.py
    post:scripts/package_firmware.py
monitor_speed = 115200
upload_protocol = esptool
board_build.partitions = redux_16MB.csv
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.28
    madhephaestus/ESP32Encoder@5.0.0
    mathertel/OneButton@2.6.2
    lvgl/lvgl@9.5.0
    ; lowbaud/NimBLE-Arduino fix/chained-mbuf-read
    https://github.com/lowbaud/NimBLE-Arduino.git#32160a2737c8fd2dc6e73a5d35bc62338bf17122
    bblanchon/ArduinoJson@7.4.3
build_flags = 
    -D BUILD_TARGET=\"$PIOENV\"
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I src




[env:m5stack-core2]
board = m5stack-core2
build_flags = 
     ${env.build_flags}



[env:m5stack-cores3]
board = m5stack-cores3
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
build_flags =
     -D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1   
     ${env.build_flags}

;upload_port = com7
;monitor_port = com7
