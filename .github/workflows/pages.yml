name: Update documentation and web flasher

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Documentation and firmware operation
        required: true
        default: Deploy documentation using published firmware
        type: choice
        options:
          - Deploy documentation using published firmware
          - Publish selected branch as development firmware
  release:
    types: [published]

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      DOCS_SOURCE: ${{ (github.event_name == 'release' || inputs.operation == 'Publish selected branch as development firmware') && '_documentation/docs' || 'docs' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO downloads
        if: github.event_name == 'release' || inputs.operation == 'Publish selected branch as development firmware'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        if: github.event_name == 'release' || inputs.operation == 'Publish selected branch as development firmware'
        run: python -m pip install platformio==6.1.19

      - name: Verify release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#[vV]}"
          project_version="$(python -c 'from scripts.project_metadata import load_project_metadata; print(load_project_metadata("platformio.ini").version)')"

          if [ "$tag_version" != "$project_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $project_version"
            exit 1
          fi

      - name: Test release tooling
        if: github.event_name == 'release' || inputs.operation == 'Publish selected branch as development firmware'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build official firmware
        if: github.event_name == 'release'
        run: python release_build.py

      - name: Build development firmware
        if: inputs.operation == 'Publish selected branch as development firmware'
        run: python release_build.py --charge-current 500

      - name: Write official release information
        if: github.event_name == 'release'
        run: >-
          python scripts/write_release_info.py
          build/release/release-info.json
          --tag "${{ github.event.release.tag_name }}"
          --commit "$GITHUB_SHA"
          --channel release
          --timestamp "${{ github.event.release.published_at }}"

      - name: Set development release identifiers
        if: inputs.operation == 'Publish selected branch as development firmware'
        shell: bash
        run: |
          short_commit="${GITHUB_SHA:0:8}"
          development_tag="development-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_commit}"
          echo "DEVELOPMENT_TAG=$development_tag" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_BUNDLE=web-flasher-${development_tag}.zip" >> "$GITHUB_ENV"

      - name: Write development release information
        if: inputs.operation == 'Publish selected branch as development firmware'
        shell: bash
        run: |
          python scripts/write_release_info.py \
            build/release/release-info.json \
            --tag "$DEVELOPMENT_TAG" \
            --commit "$GITHUB_SHA" \
            --channel development \
            --source-ref "$GITHUB_REF_NAME"

      - name: Create official release bundle
        if: github.event_name == 'release'
        shell: bash
        run: |
          release_bundle="web-flasher-${GITHUB_REF_NAME}.zip"
          (cd build/release && zip -r "../../$release_bundle" .)
          echo "RELEASE_BUNDLE=$release_bundle" >> "$GITHUB_ENV"

      - name: Attach official web flasher bundle
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RELEASE_BUNDLE" --clobber

      - name: Create development release bundle
        if: inputs.operation == 'Publish selected branch as development firmware'
        shell: bash
        run: (cd build/release && zip -r "../../$DEVELOPMENT_BUNDLE" .)

      - name: Publish development prerelease
        if: inputs.operation == 'Publish selected branch as development firmware'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$DEVELOPMENT_TAG" "$DEVELOPMENT_BUNDLE" \
            --target "$GITHUB_SHA" \
            --title "Development build from $GITHUB_REF_NAME ($DEVELOPMENT_TAG)" \
            --notes "Development firmware built from $GITHUB_REF_NAME at $GITHUB_SHA." \
            --prerelease \
            --latest=false

      - name: Check out default-branch documentation
        if: github.event_name == 'release' || inputs.operation == 'Publish selected branch as development firmware'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _documentation

      - name: Find published firmware releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            > _official_releases.json

          gh release list \
            --exclude-drafts \
            --limit 100 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            > _releases.json

          official_tag="$(python scripts/select_webflasher_release.py \
            _official_releases.json --channel release)"
          development_tag="$(python scripts/select_webflasher_release.py \
            _releases.json --channel development --optional)"

          echo "OFFICIAL_TAG=$official_tag" >> "$GITHUB_ENV"
          echo "PUBLISHED_DEVELOPMENT_TAG=$development_tag" >> "$GITHUB_ENV"

      - name: Add official firmware to site source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_bundle="web-flasher-${OFFICIAL_TAG}.zip"
          mkdir -p _release/official "$DOCS_SOURCE/flash"
          gh release download "$OFFICIAL_TAG" \
            --pattern "$release_bundle" \
            --dir _release/official
          unzip "_release/official/$release_bundle" -d "$DOCS_SOURCE/flash"

      - name: Add development firmware to site source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$PUBLISHED_DEVELOPMENT_TAG" ]; then
            echo "No published development firmware was found; skipping it."
            exit 0
          fi

          development_bundle="web-flasher-${PUBLISHED_DEVELOPMENT_TAG}.zip"
          mkdir -p _release/development "$DOCS_SOURCE/flash/development"
          gh release download "$PUBLISHED_DEVELOPMENT_TAG" \
            --pattern "$development_bundle" \
            --dir _release/development
          unzip "_release/development/$development_bundle" \
            -d "$DOCS_SOURCE/flash/development"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./${{ env.DOCS_SOURCE }}
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
