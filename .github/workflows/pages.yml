name: Update documentation and web flasher

# Development firmware is published by publish-development.yml.
on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      DOCS_SOURCE: ${{ github.event_name == 'release' && '_documentation/docs' || 'docs' }}

    steps:
      - name: Show run parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $GITHUB_REF ($GITHUB_REF_TYPE) at $GITHUB_SHA"
          echo "Site source: $DOCS_SOURCE"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO downloads
        if: github.event_name == 'release'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        if: github.event_name == 'release'
        run: python -m pip install platformio==6.1.19

      - name: Verify release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#[vV]}"
          project_version="$(python -c 'from scripts.project_metadata import load_project_metadata; print(load_project_metadata("platformio.ini").version)')"

          if [ "$tag_version" != "$project_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $project_version"
            exit 1
          fi

      - name: Test release tooling
        if: github.event_name == 'release'
        run: python -m unittest discover -s test/python -p "test_*.py"

      - name: Build official firmware
        if: github.event_name == 'release'
        run: python release_build.py

      - name: Write official release information
        if: github.event_name == 'release'
        run: >-
          python scripts/write_release_info.py
          build/release/release-info.json
          --tag "${{ github.event.release.tag_name }}"
          --commit "$GITHUB_SHA"
          --channel release
          --timestamp "${{ github.event.release.published_at }}"

      - name: Create official release bundle
        if: github.event_name == 'release'
        shell: bash
        run: |
          release_bundle="web-flasher-${GITHUB_REF_NAME}.zip"
          (cd build/release && zip -r "../../$release_bundle" .)
          echo "RELEASE_BUNDLE=$release_bundle" >> "$GITHUB_ENV"

      - name: Attach official web flasher bundle
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RELEASE_BUNDLE" --clobber

      - name: Check out default-branch documentation
        if: github.event_name == 'release'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _documentation

      - name: Add published firmware to site source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/add_flasher_firmware.sh "$DOCS_SOURCE"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./${{ env.DOCS_SOURCE }}
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
